<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meri Websites — Link Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET & VARIABLES ===== */
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg-deep: #0a0a1a;
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.1);
  --glass-hover: rgba(255,255,255,0.1);
  --text-primary: #f0f0ff;
  --text-secondary: #8888aa;
  --accent-1: #6366f1;
  --accent-2: #a855f7;
  --accent-3: #ec4899;
  --danger: #ef4444;
  --success: #22c55e;
  --radius: 16px;
  --radius-sm: 10px;
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ===== ANIMATED GRADIENT BACKGROUND (from aurora-bloom-bg-flip) ===== */
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: 
    radial-gradient(circle at 20% 30%, rgba(99,102,241,0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(168,85,247,0.12) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(236,72,153,0.08) 0%, transparent 60%);
  animation: auroraFloat 20s ease-in-out infinite;
  z-index: 0;
  pointer-events: none;
}
@keyframes auroraFloat {
  0%,100% { transform: translate(0,0) rotate(0deg); }
  33% { transform: translate(5%,-3%) rotate(2deg); }
  66% { transform: translate(-3%,5%) rotate(-2deg); }
}

/* ===== PAGE LAYOUT ===== */
.page-wrap {
  position: relative;
  z-index: 1;
  max-width: 620px;
  margin: 0 auto;
  padding: 48px 20px 80px;
  min-height: 100vh;
}
.page-header { text-align: center; margin-bottom: 36px; }
.avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
  display: grid; place-items: center;
  font-size: 28px; font-weight: 700;
  margin: 0 auto 16px;
  box-shadow: 0 8px 32px rgba(99,102,241,0.35);
  animation: avatarPulse 3s ease-in-out infinite;
}
@keyframes avatarPulse {
  0%,100% { box-shadow: 0 8px 32px rgba(99,102,241,0.35); }
  50% { box-shadow: 0 8px 48px rgba(168,85,247,0.5); }
}
.page-header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
.page-header p { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }

/* ===== LINK CARDS (glassmorphism from shotcraft) ===== */
.links-container { display: flex; flex-direction: column; gap: 12px; }
.link-card {
  display: flex; align-items: center; gap: 14px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 16px 18px;
  text-decoration: none;
  color: inherit;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(20px);
  animation: cardEntry 0.5s ease forwards;
}
.link-card:nth-child(1) { animation-delay: 0.05s; }
.link-card:nth-child(2) { animation-delay: 0.1s; }
.link-card:nth-child(3) { animation-delay: 0.15s; }
.link-card:nth-child(4) { animation-delay: 0.2s; }
.link-card:nth-child(5) { animation-delay: 0.25s; }
.link-card:nth-child(6) { animation-delay: 0.3s; }
.link-card:nth-child(7) { animation-delay: 0.35s; }
.link-card:nth-child(8) { animation-delay: 0.4s; }
.link-card:nth-child(9) { animation-delay: 0.45s; }
.link-card:nth-child(10) { animation-delay: 0.5s; }

@keyframes cardEntry {
  to { opacity: 1; transform: translateY(0); }
}

.link-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  transition: left 0.6s ease;
}
.link-card:hover::before { left: 100%; }
.link-card:hover {
  background: var(--glass-hover);
  border-color: rgba(99,102,241,0.4);
  transform: translateY(-3px) scale(1.01);
  box-shadow: 0 12px 40px rgba(99,102,241,0.15);
}
.link-card:active { transform: translateY(-1px) scale(0.99); }

.link-icon {
  width: 46px; height: 46px;
  border-radius: 12px;
  display: grid; place-items: center;
  font-weight: 700; font-size: 18px;
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  color: white;
}
.link-info { flex: 1; min-width: 0; }
.link-info h3 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-info p { font-size: 13px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-arrow { color: var(--text-secondary); font-size: 18px; transition: transform 0.3s, color 0.3s; }
.link-card:hover .link-arrow { transform: translateX(4px); color: var(--accent-1); }

/* ===== ADMIN BUTTON ===== */
.admin-fab {
  position: fixed;
  bottom: 24px; right: 24px;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  border: none;
  color: white;
  font-size: 22px;
  cursor: pointer;
  display: grid; place-items: center;
  box-shadow: 0 8px 28px rgba(99,102,241,0.4);
  transition: all 0.3s;
  z-index: 100;
}
.admin-fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 12px 36px rgba(168,85,247,0.5); }

/* ===== MODAL OVERLAY ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 200;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: rgba(20,20,40,0.95);
  backdrop-filter: blur(30px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 28px;
  width: 100%;
  max-width: 400px;
  animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.9) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-box h2 { font-size: 18px; margin-bottom: 6px; }
.modal-box .sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; }

/* ===== PASSKEY STEPS ===== */
.passkey-step { display: none; }
.passkey-step.active { display: block; animation: fadeSlide 0.3s ease; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
.step-indicator {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 22px;
}
.step-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  transition: all 0.3s;
}
.step-dot.done { background: var(--success); }
.step-dot.active { background: var(--accent-1); box-shadow: 0 0 12px rgba(99,102,241,0.6); transform: scale(1.3); }

.passkey-input-wrap { position: relative; margin-bottom: 16px; }
.passkey-input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.passkey-input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
.passkey-input.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); animation: shake 0.4s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.btn-primary {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.2s;
  margin-top: 4px;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-ghost {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s;
}
.btn-ghost:hover { background: rgba(255,255,255,0.05); }
.error-msg { color: var(--danger); font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }

/* ===== ADMIN PANEL ===== */
.admin-panel {
  position: fixed; inset: 0;
  background: var(--bg-deep);
  z-index: 300;
  overflow-y: auto;
  display: none;
  padding: 24px 20px 60px;
}
.admin-panel.active { display: block; }
.admin-panel-inner { max-width: 680px; margin: 0 auto; }
.admin-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
}
.admin-header h2 { font-size: 20px; }
.admin-header-actions { display: flex; gap: 8px; }
.btn-sm {
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-sm-primary { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: white; }
.btn-sm-primary:hover { opacity: 0.9; }
.btn-sm-danger { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
.btn-sm-danger:hover { background: rgba(239,68,68,0.25); }

/* Add link form */
.add-form {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  display: none;
}
.add-form.active { display: block; animation: fadeSlide 0.3s ease; }
.add-form input, .add-form textarea {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.add-form input:focus, .add-form textarea:focus { border-color: var(--accent-1); }
.add-form textarea { resize: vertical; min-height: 60px; }

/* Admin link list */
.admin-link-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: background 0.2s;
}
.admin-link-item:hover { background: var(--glass-hover); }
.admin-link-item .drag-handle {
  cursor: grab; color: var(--text-secondary); font-size: 16px; user-select: none;
  padding: 4px;
}
.admin-link-item .drag-handle:active { cursor: grabbing; }
.admin-link-item .info { flex: 1; min-width: 0; }
.admin-link-item .info h4 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-link-item .info p { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-link-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
.icon-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: none;
  background: rgba(255,255,255,0.06);
  color: var(--text-secondary);
  cursor: pointer;
  display: grid; place-items: center;
  font-size: 14px;
  transition: all 0.2s;
}
.icon-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }
.icon-btn.del:hover { background: rgba(239,68,68,0.2); color: var(--danger); }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(30,30,50,0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 12px 24px;
  font-size: 14px;
  z-index: 999;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Empty state */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }

/* Responsive */
@media (max-width: 480px) {
  .page-wrap { padding: 32px 14px 60px; }
  .page-header h1 { font-size: 20px; }
  .link-card { padding: 14px; }
  .link-icon { width: 40px; height: 40px; font-size: 16px; }
  .modal-box { padding: 22px; }
  .admin-fab { bottom: 18px; right: 18px; width: 48px; height: 48px; }
  .admin-header h2 { font-size: 17px; }
}
</style>
</head>
<body>

<!-- ===== PUBLIC PAGE ===== -->
<div class="page-wrap" id="publicPage">
  <div class="page-header">
    <div class="avatar">V</div>
    <h1>Meri Websites</h1>
    <p>Mere saare projects ek jagah</p>
  </div>
  <div class="links-container" id="linksContainer">
    <!-- Links JS se render honge -->
  </div>
</div>

<!-- Admin FAB -->
<button class="admin-fab" id="adminFab" title="Admin Panel">⚙️</button>

<!-- ===== PASSKEY MODAL ===== -->
<div class="modal-overlay" id="passkeyModal">
  <div class="modal-box">
    <div class="step-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <!-- Step 1 -->
    <div class="passkey-step active" id="step1">
      <h2>🔐 Passkey 1 / 3</h2>
      <p class="sub">Pehla passkey enter karo admin access ke liye</p>
      <div class="passkey-input-wrap">
        <input type="password" class="passkey-input" id="pk1" placeholder="Passkey 1 daalo..." autocomplete="off">
      </div>
      <button class="btn-primary" onclick="verifyStep(1)">Verify →</button>
      <button class="btn-ghost" onclick="closePasskeyModal()">Cancel</button>
      <div class="error-msg" id="err1"></div>
    </div>

    <!-- Step 2 -->
    <div class="passkey-step" id="step2">
      <h2>🔑 Passkey 2 / 3</h2>
      <p class="sub">Dusra passkey enter karo</p>
      <div class="passkey-input-wrap">
        <input type="password" class="passkey-input" id="pk2" placeholder="Passkey 2 daalo..." autocomplete="off">
      </div>
      <button class="btn-primary" onclick="verifyStep(2)">Verify →</button>
      <button class="btn-ghost" onclick="closePasskeyModal()">Cancel</button>
      <div class="error-msg" id="err2"></div>
    </div>

    <!-- Step 3 -->
    <div class="passkey-step" id="step3">
      <h2>🔒 Passkey 3 / 3</h2>
      <p class="sub">Aakhri passkey — phir admin panel khul jayega</p>
      <div class="passkey-input-wrap">
        <input type="password" class="passkey-input" id="pk3" placeholder="Passkey 3 daalo..." autocomplete="off">
      </div>
      <button class="btn-primary" onclick="verifyStep(3)">Unlock Admin →</button>
      <button class="btn-ghost" onclick="closePasskeyModal()">Cancel</button>
      <div class="error-msg" id="err3"></div>
    </div>
  </div>
</div>

<!-- ===== ADMIN PANEL ===== -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-panel-inner">
    <div class="admin-header">
      <h2>⚙️ Admin Panel</h2>
      <div class="admin-header-actions">
        <button class="btn-sm btn-sm-primary" onclick="toggleAddForm()">+ Add Link</button>
        <button class="btn-sm btn-sm-danger" onclick="closeAdmin()">Exit</button>
      </div>
    </div>

    <!-- Add Form -->
    <div class="add-form" id="addForm">
      <input type="text" id="addName" placeholder="Website ka naam (e.g. My Blog)">
      <input type="url" id="addUrl" placeholder="https://example.com">
      <input type="text" id="addDesc" placeholder="Chhoti description (optional)">
      <input type="text" id="addEmoji" placeholder="Emoji icon (e.g. 🌐) — optional" maxlength="4">
      <button class="btn-primary" onclick="addLink()">Save Link</button>
    </div>

    <!-- Links List -->
    <div id="adminLinksList"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   PASSKEYS — 3-Step Authentication
   ============================================================ */
const PASSKEYS = {
  1: 'VINCENT-ALPHA-2026',
  2: 'SHOTCRAFT-BETA-99',
  3: 'ADMIN-OMEGA-777'
};

let currentStep = 1;
let authenticatedSteps = { 1: false, 2: false, 3: false };

/* ============================================================
   DATA — LocalStorage se links load/save
   ============================================================ */
const STORAGE_KEY = 'my_website_links';

const DEFAULT_LINKS = [
  { id: 1, name: 'Example Site', url: 'https://example.com', desc: 'Yeh meri pehli website hai', emoji: '🌐' },
  { id: 2, name: 'My Blog', url: 'https://blog.example.com', desc: 'Mera personal blog', emoji: '📝' },
  { id: 3, name: 'Portfolio', url: 'https://portfolio.example.com', desc: 'Mera design portfolio', emoji: '🎨' },
  { id: 4, name: 'YouTube Channel', url: 'https://youtube.com/@mychannel', desc: 'Video content', emoji: '▶️' },
  { id: 5, name: 'GitHub', url: 'https://github.com/myusername', desc: 'Code projects', emoji: '💻' }
];

function loadLinks() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return JSON.parse(stored);
  } catch(e) {}
  return [...DEFAULT_LINKS];
}

function saveLinks(links) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
}

let linksData = loadLinks();

/* ============================================================
   RENDER PUBLIC LINKS
   ============================================================ */
function renderPublicLinks() {
  const container = document.getElementById('linksContainer');
  if (!container) return;

  if (linksData.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🔗</div><p>Abhi koi link nahi hai. Admin panel se add karo.</p></div>`;
    return;
  }

  container.innerHTML = linksData.map(link => `
    <a class="link-card" href="${escapeAttr(link.url)}" target="_blank" rel="noopener">
      <div class="link-icon">${link.emoji || '🌐'}</div>
      <div class="link-info">
        <h3>${escapeHtml(link.name)}</h3>
        ${link.desc ? `<p>${escapeHtml(link.desc)}</p>` : ''}
      </div>
      <span class="link-arrow">→</span>
    </a>
  `).join('');
}

/* ============================================================
   RENDER ADMIN LINKS
   ============================================================ */
function renderAdminLinks() {
  const container = document.getElementById('adminLinksList');
  if (!container) return;

  if (linksData.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>Koi link nahi. "+ Add Link" dabao.</p></div>`;
    return;
  }

  container.innerHTML = linksData.map((link, i) => `
    <div class="admin-link-item" data-id="${link.id}">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <div class="info">
        <h4>${escapeHtml(link.emoji || '🌐')} ${escapeHtml(link.name)}</h4>
        <p>${escapeHtml(link.url)}</p>
      </div>
      <div class="actions">
        <button class="icon-btn" onclick="editLink(${link.id})" title="Edit">✏️</button>
        <button class="icon-btn" onclick="moveLink(${i}, -1)" title="Move Up" ${i === 0 ? 'style="opacity:0.3;pointer-events:none"' : ''}>↑</button>
        <button class="icon-btn" onclick="moveLink(${i}, 1)" title="Move Down" ${i === linksData.length - 1 ? 'style="opacity:0.3;pointer-events:none"' : ''}>↓</button>
        <button class="icon-btn del" onclick="deleteLink(${link.id})" title="Delete">🗑</button>
      </div>
    </div>
  `).join('');
}

/* ============================================================
   PASSKEY VERIFICATION
   ============================================================ */
function verifyStep(step) {
  const input = document.getElementById('pk' + step);
  const errEl = document.getElementById('err' + step);
  const val = input.value.trim();

  if (val === PASSKEYS[step]) {
    // Success
    authenticatedSteps[step] = true;
    input.classList.remove('error');
    errEl.textContent = '';
    document.getElementById('dot' + step).classList.add('done');
    document.getElementById('dot' + step).classList.remove('active');

    if (step < 3) {
      // Move to next step
      document.getElementById('step' + step).classList.remove('active');
      currentStep = step + 1;
      document.getElementById('step' + currentStep).classList.add('active');
      document.getElementById('dot' + currentStep).classList.add('active');
      document.getElementById('pk' + currentStep).focus();
    } else {
      // All 3 verified — open admin
      showToast('✅ Admin access granted!');
      setTimeout(() => {
        closePasskeyModal();
        openAdmin();
      }, 500);
    }
  } else {
    // Wrong passkey
    input.classList.add('error');
    errEl.textContent = `❌ Galat passkey. Try again.`;
    input.value = '';
    input.focus();
    setTimeout(() => input.classList.remove('error'), 600);
  }
}

function openPasskeyModal() {
  currentStep = 1;
  authenticatedSteps = { 1: false, 2: false, 3: false };
  // Reset UI
  for (let i = 1; i <= 3; i++) {
    document.getElementById('step' + i).classList.remove('active');
    document.getElementById('dot' + i).classList.remove('done', 'active');
    document.getElementById('err' + i).textContent = '';
    document.getElementById('pk' + i).value = '';
    document.getElementById('pk' + i).classList.remove('error');
  }
  document.getElementById('step1').classList.add('active');
  document.getElementById('dot1').classList.add('active');
  document.getElementById('passkeyModal').classList.add('active');
  setTimeout(() => document.getElementById('pk1').focus(), 100);
}

function closePasskeyModal() {
  document.getElementById('passkeyModal').classList.remove('active');
}

/* ============================================================
   ADMIN PANEL
   ============================================================ */
function openAdmin() {
  document.getElementById('adminPanel').classList.add('active');
  document.body.style.overflow = 'hidden';
  renderAdminLinks();
}

function closeAdmin() {
  document.getElementById('adminPanel').classList.remove('active');
  document.body.style.overflow = '';
  renderPublicLinks();
  showToast('👋 Admin panel closed');
}

/* ============================================================
   CRUD OPERATIONS
   ============================================================ */
function toggleAddForm() {
  const form = document.getElementById('addForm');
  form.classList.toggle('active');
  if (form.classList.contains('active')) {
    document.getElementById('addName').focus();
  } else {
    clearAddForm();
  }
}

function clearAddForm() {
  document.getElementById('addName').value = '';
  document.getElementById('addUrl').value = '';
  document.getElementById('addDesc').value = '';
  document.getElementById('addEmoji').value = '';
}

function addLink() {
  const name = document.getElementById('addName').value.trim();
  const url = document.getElementById('addUrl').value.trim();
  const desc = document.getElementById('addDesc').value.trim();
  const emoji = document.getElementById('addEmoji').value.trim() || '🌐';

  if (!name || !url) {
    showToast('⚠️ Naam aur URL dono zaroori hain');
    return;
  }

  let finalUrl = url;
  if (!/^https?:\/\//i.test(finalUrl)) finalUrl = 'https://' + finalUrl;

  const newLink = {
    id: Date.now(),
    name, url: finalUrl, desc, emoji
  };

  linksData.push(newLink);
  saveLinks(linksData);
  renderAdminLinks();
  clearAddForm();
  document.getElementById('addForm').classList.remove('active');
  showToast('✅ Link add ho gaya!');
}

function editLink(id) {
  const link = linksData.find(l => l.id === id);
  if (!link) return;

  const newName = prompt('Naya naam:', link.name);
  if (newName === null) return;
  const newUrl = prompt('Naya URL:', link.url);
  if (newUrl === null) return;
  const newDesc = prompt('Nayi description:', link.desc || '');

  link.name = newName.trim() || link.name;
  link.url = newUrl.trim() || link.url;
  link.desc = newDesc.trim();
  saveLinks(linksData);
  renderAdminLinks();
  showToast('✏️ Link update ho gaya');
}

function deleteLink(id) {
  if (!confirm('Pakka delete karna hai?')) return;
  linksData = linksData.filter(l => l.id !== id);
  saveLinks(linksData);
  renderAdminLinks();
  showToast('🗑️ Link delete ho gaya');
}

function moveLink(index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= linksData.length) return;
  [linksData[index], linksData[newIndex]] = [linksData[newIndex], linksData[index]];
  saveLinks(linksData);
  renderAdminLinks();
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */
document.getElementById('adminFab').addEventListener('click', openPasskeyModal);

// Enter key support for passkey inputs
[1,2,3].forEach(i => {
  document.getElementById('pk' + i).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') verifyStep(i);
  });
});

// Close modal on overlay click
document.getElementById('passkeyModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closePasskeyModal();
});

// Close modal on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('passkeyModal').classList.contains('active')) closePasskeyModal();
    if (document.getElementById('adminPanel').classList.contains('active')) closeAdmin();
  }
});

/* ============================================================
   INIT
   ============================================================ */
renderPublicLinks();
</script>
