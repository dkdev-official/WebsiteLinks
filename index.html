<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="DPMU9i-Oo26X_V_4s8V9ZNIit2Ng475wfpuYLD-DdyY" />

<!-- SEO -->
<meta name="description" content="Explore projects, websites, tools and creations by DK.DEV in one place.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://dkdev-official.github.io/WebsiteLinks/">

<!-- Social sharing -->
<meta property="og:title" content="Website Links">
<meta property="og:description" content="Explore projects, websites, tools and creations by DK.DEV in one place.">
<meta property="og:url" content="https://dkdev-official.github.io/WebsiteLinks/">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Website Links">
<meta name="twitter:description" content="Explore projects, websites, tools and creations by DK.DEV in one place.">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Links | DK.DEV Projects & Websites</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root, [data-theme="dark"] {
  --bg:#0a0a0a; --bg-elev:#101010; --bg-card:#111111; --bg-card-hover:#161616;
  --border:#1c1c1c; --border-strong:#2a2a2a; --border-hover:#3a3a3a;
  --text:#f5f5f5; --text-dim:#8a8a8a; --text-mute:#555555;
  --accent:#ffffff; --accent-contrast:#0a0a0a;
  --glow:rgba(255,255,255,0.07);
  --shadow-md:0 8px 30px rgba(0,0,0,0.5);
  --shadow-lg:0 24px 60px rgba(0,0,0,0.7);
  --grain:0.055; --danger:#ff5c5c; --success:#4ade80;
}
[data-theme="light"] {
  --bg:#fafafa; --bg-elev:#ffffff; --bg-card:#ffffff; --bg-card-hover:#ffffff;
  --border:#e8e8e8; --border-strong:#d4d4d4; --border-hover:#0a0a0a;
  --text:#0a0a0a; --text-dim:#6b6b6b; --text-mute:#a3a3a3;
  --accent:#0a0a0a; --accent-contrast:#ffffff;
  --glow:rgba(0,0,0,0.05);
  --shadow-md:0 8px 30px rgba(0,0,0,0.06);
  --shadow-lg:0 24px 60px rgba(0,0,0,0.1);
  --grain:0.035; --danger:#dc2626; --success:#16a34a;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-0.011em;
  transition:background 0.5s cubic-bezier(0.4,0,0.2,1),color 0.5s cubic-bezier(0.4,0,0.2,1);
}
::selection{background:var(--accent);color:var(--accent-contrast)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
body::after{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  opacity:var(--grain);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;transition:opacity 0.5s;
}
.shell{max-width:720px;margin:0 auto;padding:28px 24px 100px;position:relative;z-index:1}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:72px;animation:fadeDown 0.6s cubic-bezier(0.4,0,0.2,1) both;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);min-width:0}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-contrast);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:0;flex-shrink:0}
.brand-sep{color:var(--text-mute)}
.brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-top{width:34px;height:34px;border-radius:9px;background:var(--bg-card);border:1px solid var(--border-strong);color:var(--text-dim);display:grid;place-items:center;transition:all 0.25s}
.icon-top:hover{color:var(--text);border-color:var(--border-hover)}
.icon-top svg{width:15px;height:15px}
.icon-top.spinning svg{animation:spin 0.9s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.theme-toggle{position:relative;width:60px;height:30px;border-radius:999px;background:var(--bg-card);border:1px solid var(--border-strong);transition:border-color 0.3s,background 0.3s;flex-shrink:0}
.theme-toggle:hover{border-color:var(--border-hover)}
.theme-toggle .thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-contrast);display:grid;place-items:center;transition:transform 0.45s cubic-bezier(0.68,-0.4,0.27,1.4),background 0.3s}
[data-theme="light"] .theme-toggle .thumb{transform:translateX(30px)}
.theme-toggle svg{width:12px;height:12px;display:block}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
[data-theme="light"] .theme-toggle .icon-sun{display:block}
[data-theme="light"] .theme-toggle .icon-moon{display:none}
.hero{margin-bottom:40px}
.hero-status{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);padding:7px 12px;border:1px solid var(--border);border-radius:999px;margin-bottom:28px;animation:fadeUp 0.7s 0.1s cubic-bezier(0.4,0,0.2,1) both}
.hero-status .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 currentColor;animation:pulse2 2.2s ease-in-out infinite;color:var(--success)}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--success) 70%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.hero h1{font-size:clamp(38px,6.5vw,60px);font-weight:700;line-height:1.02;letter-spacing:-0.035em;margin-bottom:22px}
.hero h1 .line{display:block;overflow:hidden}
.hero h1 .line span{display:block;animation:lineUp 0.9s cubic-bezier(0.16,1,0.3,1) both}
.hero h1 .line:nth-child(1) span{animation-delay:0.15s}
.hero p{font-size:15px;color:var(--text-dim);max-width:520px;line-height:1.6;animation:fadeUp 0.8s 0.4s cubic-bezier(0.4,0,0.2,1) both}
@keyframes lineUp{from{transform:translateY(110%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeDown{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}
.search-wrap{margin-bottom:24px;animation:fadeUp 0.8s 0.5s cubic-bezier(0.4,0,0.2,1) both}
.search-box{position:relative;display:flex;align-items:center;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:14px;transition:border-color 0.25s,box-shadow 0.25s}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent)}
.search-box .search-icon{position:absolute;left:18px;width:18px;height:18px;color:var(--text-mute);pointer-events:none;transition:color 0.25s}
.search-box:focus-within .search-icon{color:var(--accent)}
.search-input{width:100%;padding:16px 52px 16px 50px;background:transparent;border:none;color:var(--text);font-size:15px;font-weight:500;outline:none;letter-spacing:-0.005em;font-family:inherit}
.search-input::placeholder{color:var(--text-mute);font-weight:400}
.search-clear{position:absolute;right:14px;width:26px;height:26px;border-radius:50%;background:var(--bg-elev);border:1px solid var(--border);color:var(--text-dim);display:none;align-items:center;justify-content:center;transition:all 0.2s}
.search-clear:hover{color:var(--text);border-color:var(--border-hover);background:var(--bg-card-hover)}
.search-clear.visible{display:flex}
.search-clear svg{width:11px;height:11px}
.search-meta{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-mute);margin-bottom:16px;display:none;animation:fadeUp 0.3s ease}
.search-meta.visible{display:block}
.search-meta strong{color:var(--text);font-weight:600}
.link-title mark{background:#fbbf24;color:#000;padding:0 2px;border-radius:3px}
.section-label{display:flex;align-items:center;gap:14px;margin-bottom:20px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-mute);animation:fadeUp 0.8s 0.5s cubic-bezier(0.4,0,0.2,1) both}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.links{display:flex;flex-direction:column;gap:10px}
.link{position:relative;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:18px;padding:18px 22px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color 0.35s cubic-bezier(0.4,0,0.2,1),background 0.35s cubic-bezier(0.4,0,0.2,1),transform 0.35s cubic-bezier(0.4,0,0.2,1),box-shadow 0.35s cubic-bezier(0.4,0,0.2,1);opacity:0;transform:translateY(18px);animation:cardIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.link::before{content:'';position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 45%);opacity:0;transition:opacity 0.4s;pointer-events:none}
.link:hover::before{opacity:1}
.link:hover{border-color:var(--border-hover);background:var(--bg-card-hover);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.link:active{transform:translateY(0)}
.link-mono{width:56px;height:56px;border-radius:12px;background:var(--bg-elev);border:1px solid var(--border);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500;color:var(--text);transition:background 0.35s,color 0.35s,border-color 0.35s,transform 0.5s cubic-bezier(0.4,0,0.2,1);flex-shrink:0}
.link:hover .link-mono{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);transform:rotate(-4deg) scale(1.04)}
.link-body{min-width:0}
.link-title{font-size:16px;font-weight:600;letter-spacing:-0.02em;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-desc{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.link-desc.muted{color:var(--text-mute)}
.link-arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-dim);transition:all 0.35s cubic-bezier(0.4,0,0.2,1);flex-shrink:0}
.link-arrow svg{width:14px;height:14px;transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}
.link:hover .link-arrow{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}
.link:hover .link-arrow svg{transform:translate(2px,-2px)}
.empty{padding:50px 24px;text-align:center;color:var(--text-mute);border:1px dashed var(--border);border-radius:14px;font-size:14px;line-height:1.9}
.empty strong{display:block;margin-bottom:10px;font-size:15px}
.empty code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg-card);padding:3px 8px;border-radius:5px;border:1px solid var(--border);color:var(--text)}
.empty ol{padding-left:20px;margin-top:10px;text-align:left;display:inline-block}
.empty li{margin-bottom:4px}
.skeleton{height:92px;border-radius:14px;background:linear-gradient(90deg,var(--bg-card) 0%,var(--bg-card-hover) 50%,var(--bg-card) 100%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (max-width:560px){
  .shell{padding:20px 18px 90px}
  .topbar{margin-bottom:52px}
  .hero{margin-bottom:40px}
  .hero h1{font-size:34px}
  .search-input{padding:14px 46px 14px 46px;font-size:14px}
  .search-box .search-icon{left:16px;width:16px;height:16px}
  .link{grid-template-columns:48px 1fr auto;gap:14px;padding:15px 16px}
  .link-mono{width:48px;height:48px;font-size:18px;border-radius:10px}
  .link-title{font-size:15px}
  .link-arrow{width:30px;height:30px}
  .brand-text{max-width:140px}
}
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">W</div>
      <span class="brand-text">WEBSITE<span class="brand-sep">.</span>LINKS</span>
    </div>
    <div class="top-actions">
      <button class="icon-top" id="refreshBtn" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <div class="thumb">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </div>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-status">
      <span class="dot"></span>
      <span>All links · Updated</span>
    </div>
    <h1>
      <span class="line"><span>Website Links</span></span>
    </h1>
    <p>Mere saare projects aur websites ke links — ek jagah.</p>
  </section>

  <!-- SEARCH BAR -->
  <div class="search-wrap">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search links..." autocomplete="off" spellcheck="false">
      <button class="search-clear" id="searchClear" aria-label="Clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- SEARCH RESULT COUNT -->
  <div class="search-meta" id="searchMeta"></div>

  <div class="section-label">
    <span>Directory</span>
    <span id="countLabel">00</span>
  </div>
  <div class="links" id="linksContainer"></div>
</div>

<script>
const THEME_KEY = 'website_links_theme';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escAttr = s => String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const monogram = name => { const c = String(name || '').trim(); return c ? c[0].toUpperCase() : '?'; };

let allLinks = [];
let currentQuery = '';

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
  document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
}

async function loadLinks() {
  const box = $('linksContainer');
  box.innerHTML = Array(4).fill('<div class="skeleton"></div>').join('');

  try {
    const res = await fetch('links.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('links.json nahi mila (HTTP ' + res.status + ')');
    const data = await res.json();
    allLinks = Array.isArray(data.links) ? data.links : [];
  } catch (e) {
    allLinks = [];
    box.innerHTML = `
      <div class="empty">
        <strong style="color:var(--danger)">⚠️ Links load nahi hue</strong>
        ${esc(e.message)}
        <ol>
          <li><code>links.json</code> file repo me hai?</li>
          <li>JSON ka format sahi hai? (commas, quotes)</li>
          <li>File name exact <code>links.json</code> hai?</li>
        </ol>
      </div>`;
    $('countLabel').textContent = '00';
    return;
  }
  applySearch();
}

function matches(item, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return (
    String(item.name || '').toLowerCase().includes(q) ||
    String(item.desc || '').toLowerCase().includes(q) ||
    String(item.url || '').toLowerCase().includes(q)
  );
}

function highlight(text, query) {
  const safe = esc(text);
  if (!query) return safe;
  const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(' + q + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

function applySearch() {
  const q = currentQuery.trim();
  const filtered = allLinks.filter(l => matches(l, q));

  renderLinks(filtered, q);
  $('countLabel').textContent = String(filtered.length).padStart(2, '0');

  const meta = $('searchMeta');
  if (q) {
    meta.classList.add('visible');
    meta.innerHTML = `<strong>${filtered.length}</strong> result${filtered.length !== 1 ? 's' : ''} for "<strong>${esc(q)}</strong>"`;
  } else {
    meta.classList.remove('visible');
  }

  $('searchClear').classList.toggle('visible', q.length > 0);
}

function renderLinks(links, query = '') {
  const box = $('linksContainer');

  if (!links.length) {
    if (query) {
      box.innerHTML = `<div class="empty"><strong>Kuch nahi mila</strong>Try different keywords.</div>`;
    } else {
      box.innerHTML = `<div class="empty"><strong>Koi link nahi</strong><code>links.json</code> file me links add karo.</div>`;
    }
    return;
  }

  box.innerHTML = links.map((l, i) => `
    <a class="link" href="${escAttr(l.url)}" target="_blank" rel="noopener noreferrer"
       style="animation-delay:${0.05 + i * 0.05}s">
      <div class="link-mono">${esc(l.icon || monogram(l.name))}</div>
      <div class="link-body">
        <div class="link-title">${highlight(l.name, query)}</div>
        <div class="link-desc${l.desc ? '' : ' muted'}">${highlight(l.desc || l.url, query)}</div>
      </div>
      <div class="link-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M9 7h8v8"/>
        </svg>
      </div>
    </a>
  `).join('');

  box.querySelectorAll('.link').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
}

$('themeToggle').addEventListener('click', toggleTheme);

$('refreshBtn').addEventListener('click', async () => {
  const btn = $('refreshBtn');
  btn.classList.add('spinning');
  await loadLinks();
  setTimeout(() => btn.classList.remove('spinning'), 900);
});

$('searchInput').addEventListener('input', e => {
  currentQuery = e.target.value;
  applySearch();
});

$('searchClear').addEventListener('click', () => {
  $('searchInput').value = '';
  currentQuery = '';
  applySearch();
  $('searchInput').focus();
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('searchInput')) {
    e.preventDefault();
    $('searchInput').focus();
  }
  if (e.key === 'Escape' && document.activeElement === $('searchInput')) {
    $('searchInput').value = '';
    currentQuery = '';
    applySearch();
    $('searchInput').blur();
  }
});

initTheme();
loadLinks();
</script>
</body>
        </html>
